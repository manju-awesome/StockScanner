16. Final action logic I'd implement
Here's the algorithm I'd use:
IF Quality < 75
    → AVOID

ELSE IF Quality >= 85
    AND Valuation acceptable
    AND Trend confirmed
    AND Entry Score >= 75
    → BUY

ELSE IF Quality >= 85
    AND Entry Score >= 65
    → BUY ON CONFIRMATION

ELSE IF Quality >= 85
    AND Valuation expensive
    AND Trend healthy
    → OWN / WAIT FOR VALUATION

ELSE IF Quality >= 85
    AND Trend broken
    → OWN / WAIT FOR TREND RECOVERY

ELSE IF Quality 75–84
    AND Entry Score >= 75
    → WATCH / SMALL POSITION

ELSE
    → WAIT
But add one hard override:
IF fundamental deterioration is confirmed
    → THESIS BROKEN
That should override technical signals.
