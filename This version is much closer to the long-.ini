This version is much closer to the long-term decision engine I would use. But I see 4 important logic problems that will cause false BUY/AVOID decisions.
The biggest one is TSM vs META: your system currently gives TSM BUY ON CONFIRMATION, while META gets WATCH, even though META has higher quality and a much stronger MA cluster. That tells me your scoring is still mixing incompatible dimensions.

1. First: I would not use LT SCORE as the primary decision
Your table currently has:
META — Investment: Own — Entry: 27/100 — WATCH
That is actually useful information.
But:

TSM — Investment: Own — Entry: 70/100 — BUY ON CONFIRMATION
is also useful.
So I would remove the single LT Score from the primary decision path.

Use two scores:

INVESTMENT SCORE
"Do I want this company in my long-term portfolio?"
ENTRY SCORE
"Is this the right time to deploy capital?"
Then your decision becomes:

INVESTMENT SCORE
       +
ENTRY SCORE
       +
RISK / MARKET
       ↓
FINAL ACTION
