12. Your entry score should NOT reward "being far below the moving average"
This is critical.
Suppose:

Stock A = 5% below 50MA
Stock B = 30% below 50MA
Stock B should not automatically receive a higher score.
Otherwise your algorithm will favor falling knives.

Instead:

Pullback depth
should have an optimal zone.
For example:

Distance	Score
0–3%	15
3–7%	20
7–12%	25
12–20%	15
>20%	5
Then >20% below the 50MA is treated as:
Deep / potentially broken
not:
Amazing discount
This will help tremendously with stocks like META.
